<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quản lý sản phẩm | NOVA Shop</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#17202b;font-family:system-ui,Arial}header{background:#111827;color:white;padding:20px max(20px,calc((100vw - 1100px)/2));display:flex;justify-content:space-between;align-items:center}header a{color:#fff;text-decoration:none}main{max-width:1100px;margin:32px auto;padding:0 18px}.layout{display:grid;grid-template-columns:380px 1fr;gap:22px}.panel{background:white;border:1px solid #e5e7eb;border-radius:16px;padding:22px;box-shadow:0 3px 15px #11182708}h1{font-size:26px;margin:0 0 6px}h2{font-size:19px;margin:0 0 20px}.sub{color:#64748b;margin:0 0 25px}label{display:block;font-weight:600;font-size:13px;margin:14px 0 6px}input,textarea,select{width:100%;padding:12px;border:1px solid #d5dae2;border-radius:9px;font:inherit;background:#fff}textarea{resize:vertical;min-height:90px}.btn{border:0;border-radius:9px;padding:11px 15px;background:#111827;color:#fff;cursor:pointer;font-weight:650}.secondary{background:#e9edf2;color:#17202b}.danger{background:#fee2e2;color:#b91c1c}.actions{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}.preview{width:100%;height:180px;object-fit:contain;background:#f8fafc;border:1px dashed #cbd5e1;border-radius:10px;margin-top:10px}.item{display:flex;gap:14px;padding:15px 0;border-bottom:1px solid #e5e7eb}.item:last-child{border:0}.item img{width:90px;height:90px;object-fit:cover;border-radius:10px;background:#f1f5f9}.item-content{flex:1;min-width:0}.item h3{font-size:16px;margin:0 0 5px;overflow-wrap:anywhere}.item p{margin:4px 0;color:#64748b;font-size:13px}.price{font-weight:700;color:#0f766e}.empty{padding:45px 12px;text-align:center;color:#64748b}.note{font-size:12px;color:#64748b;line-height:1.5}.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:12px}.toolbar input{flex:1}.count{font-size:13px;color:#64748b;white-space:nowrap}@media(max-width:760px){.layout{grid-template-columns:1fr}main{margin:22px auto}header{padding:16px 20px}.panel{padding:18px}}</style></head><body><header><strong>NOVA SHOP · ADMIN</strong><a href="index.html">← Cửa hàng</a></header><main><h1>Quản lý sản phẩm</h1><p class="sub">Bước 1 — Đăng tải, chỉnh sửa và xóa sản phẩm.</p><div class="layout"><section class="panel"><h2 id="formTitle">Thêm sản phẩm mới</h2><form id="productForm"><label for="name">Tên sản phẩm *</label><input id="name" maxlength="120" required placeholder="Ví dụ: Áo thun cotton"><label for="price">Giá bán (VNĐ) *</label><input id="price" type="number" min="0" step="1000" required placeholder="199000"><label for="category">Danh mục *</label><select id="category" required><option value="">Chọn danh mục</option><option>Thời trang</option><option>Phụ kiện</option><option>Điện tử</option><option>Gia dụng</option><option>Mỹ phẩm</option><option>Khác</option></select><label for="stock">Số lượng trong kho *</label><input id="stock" type="number" min="0" step="1" value="1" required><label for="description">Mô tả sản phẩm</label><textarea id="description" maxlength="2000" placeholder="Thông tin chi tiết..."></textarea><label for="image">Hình ảnh sản phẩm</label><input id="image" type="file" accept="image/png,image/jpeg,image/webp"><img id="preview" class="preview" alt="Ảnh xem trước" hidden><p class="note">Chọn ảnh JPG, PNG hoặc WebP tối đa 1,5 MB. Dữ liệu demo lưu trên trình duyệt hiện tại.</p><div class="actions"><button class="btn" id="submitBtn" type="submit">Đăng sản phẩm</button><button class="btn secondary" id="resetBtn" type="button">Làm mới</button></div></form></section><section class="panel"><h2>Danh sách sản phẩm</h2><div class="toolbar"><input id="search" placeholder="Tìm theo tên sản phẩm..."><span id="count" class="count">0 sản phẩm</span></div><div id="list"></div></section></div></main><script>const KEY='nova_admin_products_v1';let products=[];let editing=null;let imageData='';const $=id=>document.getElementById(id);const money=n=>new Intl.NumberFormat('vi-VN',{style:'currency',currency:'VND'}).format(n);try{products=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(products))products=[]}catch{products=[]}function save(){try{localStorage.setItem(KEY,JSON.stringify(products));return true}catch{alert('Không đủ dung lượng lưu trữ. Hãy chọn ảnh nhỏ hơn hoặc xóa bớt sản phẩm.');return false}}function reset(){editing=null;imageData='';$('productForm').reset();$('stock').value=1;$('preview').hidden=true;$('preview').removeAttribute('src');$('formTitle').textContent='Thêm sản phẩm mới';$('submitBtn').textContent='Đăng sản phẩm'}$('resetBtn').onclick=reset;$('image').onchange=async e=>{const file=e.target.files[0];if(!file)return;if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>1.5*1024*1024){alert('Chỉ chấp nhận JPG, PNG hoặc WebP tối đa 1,5 MB');e.target.value='';return}imageData=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(file)});$('preview').src=imageData;$('preview').hidden=false};$('productForm').onsubmit=e=>{e.preventDefault();const item={id:editing||('p_'+Date.now()+'_'+Math.random().toString(36).slice(2)),name:$('name').value.trim(),price:Number($('price').value),category:$('category').value,stock:Number($('stock').value),description:$('description').value.trim(),image:imageData};if(!item.name||!item.category||!Number.isFinite(item.price)||item.price<0||!Number.isInteger(item.stock)||item.stock<0){alert('Vui lòng nhập thông tin hợp lệ');return}const old=[...products];if(editing){products=products.map(p=>p.id===editing?item:p)}else products.unshift(item);if(!save()){products=old;return}reset();render();alert('Đã lưu sản phẩm thành công!')};function render(){const term=$('search').value.trim().toLocaleLowerCase('vi');const rows=products.filter(p=>p.name.toLocaleLowerCase('vi').includes(term));$('count').textContent=products.length+' sản phẩm';const list=$('list');list.replaceChildren();if(!rows.length){const el=document.createElement('div');el.className='empty';el.textContent='Chưa có sản phẩm phù hợp.';list.append(el);return}for(const p of rows){const item=document.createElement('div');item.className='item';const img=document.createElement('img');img.alt=p.name;if(p.image)img.src=p.image;const content=document.createElement('div');content.className='item-content';const title=document.createElement('h3');title.textContent=p.name;const price=document.createElement('div');price.className='price';price.textContent=money(p.price);const meta=document.createElement('p');meta.textContent=p.category+' · Tồn kho: '+p.stock;const actions=document.createElement('div');actions.className='actions';const edit=document.createElement('button');edit.className='btn secondary';edit.textContent='Sửa';edit.onclick=()=>{editing=p.id;imageData=p.image||'';$('name').value=p.name;$('price').value=p.price;$('category').value=p.category;$('stock').value=p.stock;$('description').value=p.description||'';$('preview').hidden=!p.image;if(p.image)$('preview').src=p.image;$('image').value='';$('formTitle').textContent='Chỉnh sửa sản phẩm';$('submitBtn').textContent='Lưu thay đổi';window.scrollTo({top:0,behavior:'smooth'})};const del=document.createElement('button');del.className='btn danger';del.textContent='Xóa';del.onclick=()=>{if(!confirm('Xóa sản phẩm "'+p.name+'"?'))return;const old=[...products];products=products.filter(x=>x.id!==p.id);if(!save()){products=old;return}if(editing===p.id)reset();render()};actions.append(edit,del);content.append(title,price,meta,actions);item.append(img,content);list.append(item)}}$('search').oninput=render;render();</script></body></html>
